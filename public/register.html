<!doctype html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
    <title>注册 · Reminder Note</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body class="min-h-screen bg-ink-50 text-ink-900 dark:bg-ink-950 dark:text-ink-50 antialiased font-sans">
    <main class="min-h-screen grid place-items-center px-4">
        <div class="w-full max-w-md">
            <div class="text-center mb-8">
                <div class="mx-auto w-14 h-14 rounded-2xl bg-gradient-to-br from-brand-400 to-brand-700 grid place-items-center shadow-glow">
                    <span class="text-white text-2xl">RN</span>
                </div>
                <h1 class="mt-4 text-2xl font-semibold tracking-tight">创建账号</h1>
                <p class="mt-1 text-sm text-ink-500 dark:text-ink-400">注册一个新的备忘空间</p>
            </div>

            <form id="registerForm" class="rounded-3xl bg-white/80 dark:bg-ink-900/70 backdrop-blur shadow-soft p-6 space-y-4 border border-ink-200/60 dark:border-ink-800/60">
                <label class="block">
                    <span class="text-xs font-medium text-ink-500 dark:text-ink-400">用户名</span>
                    <input id="username" name="username" type="text" autocomplete="username" required
                        minlength="3" maxlength="32" pattern="[a-zA-Z0-9_]{3,32}"
                        class="mt-1 w-full rounded-xl border border-ink-200 dark:border-ink-700 bg-white dark:bg-ink-950 px-4 py-3 outline-none focus:ring-2 focus:ring-brand-400 transition" />
                    <span class="text-[11px] text-ink-400 dark:text-ink-500 mt-1 inline-block">3–32 位字母 / 数字 / 下划线</span>
                </label>
                <label class="block">
                    <span class="text-xs font-medium text-ink-500 dark:text-ink-400">密码</span>
                    <input id="password" name="password" type="password" autocomplete="new-password" required
                        minlength="8" maxlength="256"
                        class="mt-1 w-full rounded-xl border border-ink-200 dark:border-ink-700 bg-white dark:bg-ink-950 px-4 py-3 outline-none focus:ring-2 focus:ring-brand-400 transition" />
                    <span class="text-[11px] text-ink-400 dark:text-ink-500 mt-1 inline-block">至少 8 位</span>
                </label>
                <label class="block">
                    <span class="text-xs font-medium text-ink-500 dark:text-ink-400">确认密码</span>
                    <input id="password2" name="password2" type="password" autocomplete="new-password" required
                        minlength="8" maxlength="256"
                        class="mt-1 w-full rounded-xl border border-ink-200 dark:border-ink-700 bg-white dark:bg-ink-950 px-4 py-3 outline-none focus:ring-2 focus:ring-brand-400 transition" />
                </label>

                <button id="submitBtn" type="submit"
                    class="w-full rounded-xl bg-gradient-to-r from-brand-500 to-brand-700 hover:from-brand-400 hover:to-brand-600 active:scale-[0.99] transition text-white font-medium py-3 shadow-glow disabled:opacity-60 disabled:cursor-not-allowed">
                    <span id="submitLabel">创建账号</span>
                </button>

                <p id="errorMsg" class="hidden text-sm text-accent-500 text-center"></p>
            </form>

            <p class="mt-6 text-center text-xs text-ink-500 dark:text-ink-400">
                已有账号？<a class="text-brand-600 dark:text-brand-300 hover:underline" href="login.html">登录</a>
            </p>
        </div>
    </main>

    <script>
        const f = document.getElementById('registerForm');
        const errorEl = document.getElementById('errorMsg');
        const btn = document.getElementById('submitBtn');
        const label = document.getElementById('submitLabel');

        const API_BASE = (() => {
            const path = location.pathname;
            const idx = path.indexOf('/public/');
            if (idx >= 0) return path.slice(0, idx + 8) + 'api';
            const lastSlash = path.lastIndexOf('/');
            const base = lastSlash > 0 ? path.slice(0, lastSlash + 1) : '/';
            return (base.endsWith('/') ? base : base + '/') + 'api';
        })();

        function showError(msg) {
            errorEl.textContent = msg;
            errorEl.classList.remove('hidden');
        }

        // Wipe any leftover Dexie cache from a previous account on this device.
        async function wipeIndexedDB() {
            try {
                const dbs = (typeof indexedDB.databases === 'function') ? await indexedDB.databases() : [];
                const names = dbs.map(d => d.name).filter(Boolean);
                if (!names.includes('reminder-note')) names.push('reminder-note');
                await Promise.all(names.map(n => new Promise((resolve) => {
                    const r = indexedDB.deleteDatabase(n);
                    r.onsuccess = r.onerror = r.onblocked = () => resolve();
                })));
            } catch { /* ignore */ }
        }

        f.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.classList.add('hidden');
            const username = document.getElementById('username').value.trim();
            const pw  = document.getElementById('password').value;
            const pw2 = document.getElementById('password2').value;
            if (pw !== pw2) { showError('两次输入的密码不一致'); return; }
            if (!/^[a-zA-Z0-9_]{3,32}$/.test(username)) { showError('用户名格式不正确'); return; }
            if (pw.length < 8) { showError('密码至少 8 位'); return; }

            btn.disabled = true; label.textContent = '创建中…';
            try {
                const res = await fetch(API_BASE + '/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password: pw }),
                });
                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data?.error?.message || '注册失败');
                }
                await wipeIndexedDB();
                localStorage.setItem('rn:accessToken', data.accessToken);
                localStorage.setItem('rn:refreshToken', data.refreshToken);
                localStorage.setItem('rn:accessExp', String(data.accessExpiresAt));
                localStorage.setItem('rn:refreshExp', String(data.refreshExpiresAt));
                location.href = './index.html';
            } catch (err) {
                showError(err.message || '网络错误');
            } finally {
                btn.disabled = false; label.textContent = '创建账号';
            }
        });

        // If user is already authenticated, jump straight to the app.
        const _hasValid = (() => {
            const access = localStorage.getItem('rn:accessToken');
            const refresh = localStorage.getItem('rn:refreshToken');
            const aExp = Number(localStorage.getItem('rn:accessExp') || 0);
            const rExp = Number(localStorage.getItem('rn:refreshExp') || 0);
            const t = Date.now() + 30000;
            return (access && aExp > t) || (refresh && rExp > t);
        })();
        if (_hasValid) {
            location.replace('./index.html');
        }
    </script>
</body>
</html>
